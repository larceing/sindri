# Agente de planta (planta/agente). No lo despliega el servidor: se instala en la fábrica.
#   cambios en planta/   -> pruebas del agente y de sus drivers contra el simulador multiprotocolo
#   release planta-vX.Y.Z -> pruebas -> ghcr.io/<repo>-planta:X.Y.Z y :latest
name: Agente de planta

on:
  push:
    branches: [main]
    paths: ["planta/**", ".github/workflows/planta.yml"]
  pull_request:
    paths: ["planta/**", ".github/workflows/planta.yml"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pruebas:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'planta-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-pruebas.txt trae además lo que necesita el simulador multiprotocolo.
      - run: pip install -r planta/agente/requirements-pruebas.txt
      - run: python -m unittest -v
        working-directory: planta/agente

  imagen:
    needs: pruebas
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'planta-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=${GITHUB_REF_NAME#planta-v}" >> "$GITHUB_OUTPUT"
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}-planta" >> "$GITHUB_OUTPUT"
      - name: La etiqueta coincide con la versión del agente
        run: grep -q "^VERSION = \"${{ steps.v.outputs.version }}\"" planta/agente/agente.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: planta/agente
          push: true
          tags: |
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.imagen }}:latest
