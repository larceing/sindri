# App Android de la PDA (pda-android/): pruebas y APK de depuración para probar en el
# emulador o en una PDA. El APK queda como artefacto de la ejecución (Actions → esta
# ejecución → Artifacts). No se publica en ningún sitio ni va firmado para producción.
name: PDA Android

on:
  push:
    branches: [main]
    paths: ["pda-android/**", ".github/workflows/pda-android.yml"]
  pull_request:
    paths: ["pda-android/**", ".github/workflows/pda-android.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pda-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas y APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Scripts de escaneo sin errores de sintaxis
        run: bash -n scripts/escanear.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sindri-pda-debug
          path: pda-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
