# Comprueba el código y, en cada push a main o release publicada, construye la imagen
# y la sube a GHCR (ghcr.io/<usuario>/<repo>:sha-xxxxxxx o :vX.Y.Z).
# La despliega el servidor DEV/PRO desde Ajustes (servidor.json, tipo "servidor"):
# aquí no hacen falta ni SSH ni secretos.
# El escritorio y el agente de planta van en sus propios workflows (etiquetas
# escritorio-vX.Y.Z y planta-vX.Y.Z), para no mezclarse con las vX.Y.Z de la web.
name: Imagen

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: servidor.json es JSON válido
        run: node -e "JSON.parse(require('fs').readFileSync('servidor.json', 'utf8'))"
      - run: pnpm install --frozen-lockfile --filter "!@sindri/escritorio"
      - run: pnpm --filter "!@sindri/escritorio" -r build
      - name: Pruebas (base embebida y PostgreSQL)
        run: pnpm --filter "!@sindri/escritorio" -r test
        env:
          TEST_DATABASE_URL: postgres://postgres:pruebas@localhost:5432/postgres

  imagen:
    needs: comprobar
    if: github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=main" >> "$GITHUB_OUTPUT"
          fi
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
