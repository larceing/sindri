# Sistema de prueba de Sindri: servidor + PostgreSQL.
# Uso: copia .env.ejemplo a .env, cambia las claves y ejecuta `docker compose up -d --build`.
name: sindri-prueba

services:
  base:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sindri
      POSTGRES_USER: sindri
      POSTGRES_PASSWORD: ${CLAVE_BASE_DATOS:?Falta CLAVE_BASE_DATOS en .env}
    volumes:
      - base-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindri -d sindri"]
      interval: 5s
      timeout: 5s
      retries: 20

  sindri:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sindri:${CLAVE_BASE_DATOS}@base:5432/sindri
      SINDRI_USUARIO: ${SINDRI_USUARIO:?Falta SINDRI_USUARIO en .env}
      SINDRI_CLAVE: ${SINDRI_CLAVE:?Falta SINDRI_CLAVE en .env}
      SINDRI_DEMO: ${SINDRI_DEMO:-1}
    ports:
      - "${PUERTO:-3210}:3210"

volumes:
  base-datos:
