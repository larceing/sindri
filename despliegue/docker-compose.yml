# Sistema de prueba de Ergane: servidor + PostgreSQL.
# Uso: copia .env.ejemplo a .env, cambia las claves y ejecuta `docker compose up -d --build`.
name: ergane-prueba

services:
  base:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ergane
      POSTGRES_USER: ergane
      POSTGRES_PASSWORD: ${CLAVE_BASE_DATOS:?Falta CLAVE_BASE_DATOS en .env}
    volumes:
      - base-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergane -d ergane"]
      interval: 5s
      timeout: 5s
      retries: 20

  ergane:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ergane:${CLAVE_BASE_DATOS}@base:5432/ergane
      ERGANE_USUARIO: ${ERGANE_USUARIO:?Falta ERGANE_USUARIO en .env}
      ERGANE_CLAVE: ${ERGANE_CLAVE:?Falta ERGANE_CLAVE en .env}
      ERGANE_DEMO: ${ERGANE_DEMO:-1}
    ports:
      - "${PUERTO:-3210}:3210"

volumes:
  base-datos:
