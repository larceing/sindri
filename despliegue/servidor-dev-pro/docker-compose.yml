# Base de datos de Sindri en el servidor DEV/PRO: una instalación por entorno.
#
# Sindri no sale de aquí: lo despliega el servidor desde Ajustes (servidor.json, tipo
# "servidor") como contenedor sindri-dev / sindri-pro, que solo está en la red del proxy.
# Por eso la base está también en esa red: Sindri llega a ella por su NOMBRE DE
# CONTENEDOR (sindri-bd-dev, sindri-bd-pro), que va en DATABASE_URL.
#
# El servicio se llama «sindri_bd», no como los contenedores: Docker da a cada contenedor
# el nombre de su servicio en todas sus redes, y DEV y PRO comparten proxy_default. Si el
# servicio se llamara sindri-bd-pro, ese nombre apuntaría también a la base de DEV.
# Nadie debe usar «sindri_bd» desde fuera: solo los nombres de contenedor.
#
# ENTORNO (dev o pro) va en .env, junto a la clave. Sin puertos publicados.
name: sindri-bd-${ENTORNO:?Falta ENTORNO en .env}

services:
  sindri_bd:
    image: postgres:17
    container_name: sindri-bd-${ENTORNO}
    restart: unless-stopped
    environment:
      POSTGRES_DB: sindri
      POSTGRES_USER: sindri
      POSTGRES_PASSWORD: ${CLAVE_BASE_DATOS:?Falta CLAVE_BASE_DATOS en .env}
    volumes:
      - datos:/var/lib/postgresql/data
    networks: [proxy_default]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindri -d sindri"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Copia diaria con pg_dump en ./copias, guardando las de los últimos DIAS_COPIAS días.
  sindri_copias:
    image: postgres:17
    container_name: sindri-copias-${ENTORNO}
    restart: unless-stopped
    depends_on:
      sindri_bd:
        condition: service_healthy
    environment:
      PGHOST: sindri-bd-${ENTORNO}
      PGUSER: sindri
      PGDATABASE: sindri
      PGPASSWORD: ${CLAVE_BASE_DATOS}
      DIAS: ${DIAS_COPIAS:-14}
    volumes:
      - ./copias:/copias
    networks: [proxy_default]
    mem_limit: 64m
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/copias/sindri-$$(date +%F).sql.gz
          if pg_dump --no-owner | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "copia $$f"; else rm -f "$$f.tmp"; echo "copia FALLIDA"; fi
          find /copias -name 'sindri-*.sql.gz' -mtime +$$DIAS -delete
          sleep 86400
        done

volumes:
  datos:

networks:
  proxy_default:
    external: true
